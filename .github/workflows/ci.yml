name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
      - name: Lint (syntax-level)
        run: python -m ruff check phantom scripts tests
      - name: Tests
        run: python -m pytest -q
      - name: JS syntax
        run: |
          for f in web/*.js; do node --check "$f"; done
      - name: Shell syntax
        run: bash -n start.sh scripts/setup-linux-gamepad.sh

  windows-smoke:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall phantom scripts
      - name: CLI help
        run: |
          python -m phantom --help
          python scripts/actions_remote.py --help
          python scripts/colab_remote.py --help
      - name: Build Colab notebook
        run: python scripts/build_colab_notebook.py --out /tmp/PhantomPlay_Colab.ipynb
